; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@^6.8.0   ; ESP32 Arduino 2.0.17 (main.cpp refuse de compiler avec Arduino 3.x). Au moins 6.8 :
                                ; les versions 6.5 / 6.6 (IDF 4.4.6) ont un défaut qui rend la carte invisible pour
                                ; certains Android (avis Espressif AR2024-001). Après ce changement : « pio pkg update ».
board = esp32dev
framework = arduino
monitor_speed = 115200
; Deux emplacements de 1,5 Mo pour le programme (mise à jour à distance) + 896 Ko pour les mesures hors ligne
board_build.partitions = partitions_mair.csv
; Numéro de version, signature des mises à jour, « pio run -t cles » (voir outils/ota.py)
extra_scripts =
    pre:outils/racines_bundle.py   ; src/racines_bundle.h depuis src/racines_tls.h (racines HTTPS en mémoire flash)
    post:outils/ota.py
lib_deps =
    4-20ma/ModbusMaster @ 2.0.1
    wifwaf/MH-Z19@^1.5.4
    2dom/PxMatrix LED MATRIX library @ 1.8.2
    adafruit/Adafruit GFX Library @ 1.11.11
    bblanchon/ArduinoJson@^7.4.3
    h2zero/NimBLE-Arduino@^2.3.6    ; console Bluetooth (BLUETOOTH_ACTIF dans main.cpp)
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Bluetooth : la carte n'est que « périphérique » (le téléphone vient à elle) : on retire le reste (plus léger)
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    ; Bluetooth : un seul téléphone connecté à la fois (main.cpp ne suit qu'une connexion) : la pile et la radio ne
    ; réservent plus la mémoire de 3 connexions (valeur par défaut de NimBLE)
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    ; Bluetooth : jusqu'à 5 téléphones appairés gardés en mémoire (3 par défaut dans NimBLE), toujours un seul connecté à
    ; la fois ; chaque place en plus ne coûte que quelques centaines d'octets
    -DCONFIG_BT_NIMBLE_MAX_BONDS=5
    ; Bluetooth : NimBLE mémorise aussi, pour chaque téléphone appairé, ses abonnements (2 par téléphone : les réponses
    ; de la console et « Service Changed ») et ses fonctions (CSFC). Par défaut : 8 abonnements et 1 seule fiche de
    ; fonctions (= MAX_CONNECTIONS) : avec 5 téléphones, la mémoire débordait et l'abonnement d'un téléphone échouait
    ; (« write descriptor failed » dans Serial Bluetooth Terminal). 12 = 2 x 5 téléphones + marge.
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=12
    -DMYNEWT_VAL_BLE_STORE_MAX_CSFCS=5
    ; Bluetooth : appairage « Secure Connections » seulement (clé de 16 octets) ; l'ancien appairage « legacy », dont le
    ; code à 6 chiffres se retrouve en écoutant l'échange radio, est refusé. Tous les téléphones récents le gèrent.
    -DMYNEWT_VAL_BLE_SM_SC_ONLY=1
    ; HTTPS : vérification des certificats par bundle remplacée par celle de src/verif_bundle.h (moins de calcul RSA, donc
    ; moins de mémoire). Sans ce lien, la version d'origine trouverait un bundle vide et refuserait toute connexion.
    -Wl,--wrap=arduino_esp_crt_bundle_attach

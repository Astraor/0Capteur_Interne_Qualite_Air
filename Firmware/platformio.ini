; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@^6.0.0   ; ESP32 Arduino 2.x : main.cpp refuse de compiler avec Arduino 3.x
board = esp32dev
framework = arduino
monitor_speed = 115200
; Deux emplacements de 1,5 Mo pour le programme (mise à jour à distance) + 896 Ko pour les mesures hors ligne
board_build.partitions = partitions_mair.csv
; Numéro de version, signature des mises à jour, « pio run -t cles » (voir outils/ota.py)
extra_scripts =
    pre:outils/racines_bundle.py   ; src/racines_bundle.h depuis src/racines_tls.h (racines HTTPS en mémoire flash)
    post:outils/ota.py
lib_deps =
    4-20ma/ModbusMaster @ 2.0.1
    wifwaf/MH-Z19@^1.5.4
    2dom/PxMatrix LED MATRIX library @ 1.8.2
    adafruit/Adafruit GFX Library @ 1.11.11
    bblanchon/ArduinoJson@^7.4.3
    h2zero/NimBLE-Arduino@^2.3.6    ; console Bluetooth (BLUETOOTH_ACTIF dans main.cpp)
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Bluetooth : la carte n'est que « périphérique » (le téléphone vient à elle) : on retire le reste (plus léger)
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    ; Bluetooth : appairage « Secure Connections » seulement (clé de 16 octets) ; l'ancien appairage « legacy », dont le
    ; code à 6 chiffres se retrouve en écoutant l'échange radio, est refusé. Tous les téléphones récents le gèrent.
    -DMYNEWT_VAL_BLE_SM_SC_ONLY=1
    ; HTTPS : vérification des certificats par bundle remplacée par celle de src/verif_bundle.h (moins de calcul RSA, donc
    ; moins de mémoire). Sans ce lien, la version d'origine trouverait un bundle vide et refuserait toute connexion.
    -Wl,--wrap=arduino_esp_crt_bundle_attach
